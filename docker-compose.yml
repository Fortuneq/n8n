version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=***REMOVED***
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n

  ngrok:
    image: wernight/ngrok
    restart: always
    depends_on:
      - n8n
    environment:
      # сюда вставь свой токен с https://dashboard.ngrok.com/get-started/your-authtoken
      - NGROK_AUTH=***REMOVED***
      # Проксируем локальный порт n8n
      - NGROK_PORT=n8n:5678
    command: http n8n:5678

volumes:
  n8n_data:
